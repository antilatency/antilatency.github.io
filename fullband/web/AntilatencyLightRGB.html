<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antilatency Light - Black Body</title>
    <script src="Spectrum.js"></script>
    <script src="Loader.js"></script>
    <script src="Canvas.js"></script>
    <script src="BlackBodySpectrum.js"></script>
    <script src="Solver.js"></script>
    <script src="Drag.js"></script>
    <script src="ShowHide.js"></script>
    <link rel="stylesheet" href="Style.css">
    <script src="Main.js"></script>
</head>
<body>

    
    <canvas id="canvas" class="canvas" style=""></canvas>
    <div id="error" class="error" style="visibility: hidden;"></div>
    <div id="hint" style="visibility: hidden; width: 100%; height: 100%;">   

        <div id="hint-red" style="background-color: rgb(70, 101, 213);"
        class="icon-hand-vertical slide-hint slide-hint-animation-vertical blue-hand-position"></div>
        <div id="hint-green" style="background-color: rgb(129, 214, 39); animation-delay: 0.2s;"
        class="icon-hand-vertical slide-hint slide-hint-animation-vertical green-hand-position"></div>
        <div id="hint-blue" style="background-color: rgb(213, 55, 41); animation-delay: 0.4s;"
        class="icon-hand-vertical slide-hint slide-hint-animation-vertical red-hand-position"></div>
      
    </div>    



    <script>
        

        const hash = window.location.hash.substring(1);
        console.log('Hash:', hash);

        loadSpectrums([
            'Spectrums/RoyalBlue.spectrum',
            'Spectrums/Blue.spectrum',
            'Spectrums/Cyan.spectrum',
            'Spectrums/PCLime.spectrum',
            'Spectrums/PCAmber.spectrum',
            'Spectrums/PCRedOrange.spectrum',
            'Spectrums/PhotoRed.spectrum',
        ], (_spectrums, error) => {
            if (error) {
                showElementsById('error')
                    .textContent = 'Error loading spectrums: ' + error.message;
                return;
            }
            spectrums = _spectrums;

            StartRGB();
            showElementsById('hint');
            UpdateRGB();

            //setup dragging to change temperature
            setupSlideHandler(canvas, (v)=>{
                var width = canvas.width;
                if (v.startX < (0.3 * width)) {
                    channelB -= v.deltaY * 0.001;
                    if (channelB < 0) channelB = 0;
                    if (channelB > 1) channelB = 1;
                } else if (v.startX < (0.6 * width)) {
                    channelG -= v.deltaY * 0.001;
                    if (channelG < 0) channelG = 0;
                    if (channelG > 1) channelG = 1;
                } else {
                    channelR -= v.deltaY * 0.001;
                    if (channelR < 0) channelR = 0;
                    if (channelR > 1) channelR = 1;
                }
                hideElementsById('hint');
                UpdateRGB();
            });

            window.addEventListener("resize", UpdateRGB);
        });
    </script>
</body>
</html>
